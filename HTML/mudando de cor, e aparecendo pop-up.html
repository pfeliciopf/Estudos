<!DOCTYPE html>
<html>
<body>
    <h1>Chato não?</h1>
    <p>Está achando esse fundo muito chato? Nosso querido dev não quer aprender CSS, então o mínimo que ele pode fazer é mudar a cor do fundo.</p>
    <p>Escolha abaixo qual cor você quer:</p>

    <button type="button" onclick="document.body.style.backgroundColor = 'yellow'">Amarelo</button>

    <button type="button" onclick="document.body.style.backgroundColor = 'black'; alert('Quem apagou a luz?')">
        Preto
    </button>

    <button type="button" onclick="document.body.style.backgroundColor = 'white'; alert('Isso não faz nada!')">
        Branco
    </button>

    <button type="button" onclick="document.body.style.backgroundColor = 'pink'">Rosa</button>
    <button type="button" onclick="document.body.style.backgroundColor = 'blue'">Azul</button>
    <button type="button" onclick="document.body.style.backgroundColor = 'orange'">Laranja</button>
    <button type="button" onclick="document.body.style.backgroundColor = 'red'">Vermelho</button>

</body>
</html>
