<!DOCTYPE html>
<html>
<head>
    <title>Conversor Simples</title>
</head>
<body>

    <h1>Conversor de Celsius para Fahrenheit</h1>
    
    <p>Digite a temperatura em Celsius:</p>
    <input type="number" id="campoCelsius">
    
    <button onclick="converter()">Converter</button>
    
    <h2 id="textoResultado">Resultado: </h2>

    <script>
    function converter() {

        var celsius = document.getElementById("campoCelsius").value;
        
        var fahrenheit = (celsius * 9 / 5) + 32;
        
        document.getElementById("textoResultado").innerText = "Resultado: " + fahrenheit + " °F";
    }
    </script>

</body>
</html>
